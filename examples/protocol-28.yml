# Check compatibility against the real Protocol 28 fixture pack published
# in StellarCanary/ProtocolCanary-Fixtures, against a live Testnet RPC
# endpoint. Not every project needs every compatibility surface — a
# project with no Soroban contracts, for example, can set
# `[tests] soroban = false` in its own .stellar-canary.toml and this
# workflow does not need to change.
name: Stellar Compatibility (Protocol 28)

on:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout Protocol 28 fixtures
        uses: actions/checkout@v4
        with:
          repository: StellarCanary/ProtocolCanary-Fixtures
          # protocol-28 is the actual tag in ProtocolCanary-Fixtures (there
          # is no v0.1.0 there). Pin to it so a new pack for a future
          # protocol cannot change what this example checks against.
          ref: protocol-28
          path: canary-fixtures

      - name: Stellar Protocol Canary
        uses: StellarCanary/ProtocolCanary-Action@v1
        with:
          protocol: "28"
          fixtures-dir: canary-fixtures/protocol-28
          network: testnet
          rpc-url: https://soroban-testnet.stellar.org
