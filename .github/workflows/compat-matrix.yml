name: Offline CLI Compatibility Matrix

on:
  schedule:
    - cron: "0 3 * * 1" # Weekly on Monday at 03:00 UTC
  workflow_dispatch:
    inputs:
      engine-refs:
        description: "Engine refs to test (comma-separated, e.g. v0.1.1,v0.2.0)"
        type: string
        required: false
        default: "v0.1.1,v0.2.0"
      pack-refs:
        description: "Fixture pack refs to test (comma-separated, e.g. protocol-28,main)"
        type: string
        required: false
        default: "protocol-28,main"

permissions:
  contents: read

concurrency:
  group: compat-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Validate inputs and prepare matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      cell_count: ${{ steps.prepare.outputs.cell_count }}
    steps:
      - name: Checkout ProtocolCanary-Action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare matrix
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          ENGINE_REFS: ${{ github.event.inputs['engine-refs'] || '' }}
          PACK_REFS: ${{ github.event.inputs['pack-refs'] || '' }}
        run: node scripts/compat-matrix-inputs.mjs

  matrix:
    name: Offline CLI Compatibility (${{ matrix.engine_ref }}, ${{ matrix.pack_ref }})
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout ProtocolCanary-Action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout Protocol-Canary engine
        id: checkout-engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: StellarCanary/Protocol-Canary
          ref: ${{ matrix.engine_ref }}
          path: engine
          persist-credentials: false

      - name: Checkout ProtocolCanary-Fixtures
        id: checkout-fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: StellarCanary/ProtocolCanary-Fixtures
          ref: ${{ matrix.pack_ref }}
          path: fixtures
          persist-credentials: false

      - name: Setup Rust toolchain
        if: steps.checkout-engine.outcome == 'success' && steps.checkout-fixtures.outcome == 'success'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustc, cargo

      - name: Cache engine build
        if: steps.checkout-engine.outcome == 'success' && steps.checkout-fixtures.outcome == 'success'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin
          key: engine-${{ matrix.cell_id }}-${{ steps.checkout-engine.outputs.commit }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build engine
        id: build-engine
        if: steps.checkout-engine.outcome == 'success' && steps.checkout-fixtures.outcome == 'success'
        shell: bash
        env:
          ENGINE_COMMIT: ${{ steps.checkout-engine.outputs.commit }}
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/cell-evidence"
          mkdir -p "$evidence_dir"
          : >"${evidence_dir}/build.stdout"
          : >"${evidence_dir}/build.stderr"
          cd engine

          if [[ ! "$ENGINE_COMMIT" =~ ^([[:xdigit:]]{40}|[[:xdigit:]]{64})$ ]]; then
            echo "Engine checkout did not provide a valid commit SHA." >"${evidence_dir}/build.stderr"
            exit 1
          fi

          if [ -f crates/canary-cli/Cargo.toml ]; then
            cli_path="crates/canary-cli"
          elif [ -f canary-cli/Cargo.toml ]; then
            cli_path="canary-cli"
          else
            echo "No supported canary-cli Cargo.toml path was found." >"${evidence_dir}/build.stderr"
            exit 1
          fi

          cargo_root="${CARGO_HOME:-${HOME}/.cargo}"
          set +e
          cargo install --locked --force --path "$cli_path" --root "$cargo_root" \
            >"${evidence_dir}/build.stdout" 2>"${evidence_dir}/build.stderr"
          install_status=$?
          set -e
          if [ "$install_status" -ne 0 ]; then
            echo "::error::Engine build failed with exit code ${install_status}."
            exit "$install_status"
          fi

          binary="${cargo_root}/bin/stellar-canary"
          if [ ! -x "$binary" ]; then
            echo "::error::Installed stellar-canary binary is missing or not executable at ${binary}."
            exit 1
          fi
          echo "binary=${binary}" >> "$GITHUB_OUTPUT"

      - name: Run offline Engine CLI compatibility check
        id: run-check
        if: steps.build-engine.outcome == 'success'
        env:
          STELLAR_CANARY_BINARY: ${{ steps.build-engine.outputs.binary }}
          COMPAT_CONFIG: ${{ github.workspace }}/tests/fixtures/real-engine/offline.stellar-canary.toml
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/cell-evidence"
          mkdir -p "$evidence_dir"
          protocol=28
          fixtures_dir="fixtures/protocol-${protocol}"

          if [ ! -d "$fixtures_dir" ]; then
            printf 'Fixture pack directory is missing: %s\n' "$fixtures_dir" >"${evidence_dir}/stderr.txt"
            echo "::error::Fixture pack directory fixtures/protocol-${protocol} is missing."
            exit 1
          fi

          set +e
          timeout --foreground --signal=TERM --kill-after=30s 25m \
            "$STELLAR_CANARY_BINARY" check \
            --protocol "$protocol" \
            --config "$COMPAT_CONFIG" \
            --fixtures-dir "$fixtures_dir" \
            --format json \
            >"${evidence_dir}/report.json" 2>"${evidence_dir}/stderr.txt"
          exit_code=$?
          set -e

          printf '%s\n' "$exit_code" >"${evidence_dir}/exit-code.txt"
          echo "stellar-canary check exited with code ${exit_code}."

      - name: Generate cell facts
        if: always()
        env:
          CELL_ID: ${{ matrix.cell_id }}
          ENGINE_REF: ${{ matrix.engine_ref }}
          PACK_REF: ${{ matrix.pack_ref }}
          ENGINE_COMMIT: ${{ steps.checkout-engine.outputs.commit }}
          FIXTURES_COMMIT: ${{ steps.checkout-fixtures.outputs.commit }}
          ACTION_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXECUTION_MODE: offline-xdr
          ENGINE_CHECKOUT_OUTCOME: ${{ steps.checkout-engine.outcome }}
          FIXTURES_CHECKOUT_OUTCOME: ${{ steps.checkout-fixtures.outcome }}
          BUILD_OUTCOME: ${{ steps.build-engine.outcome }}
          CHECK_OUTCOME: ${{ steps.run-check.outcome }}
          EVIDENCE_DIR: ${{ runner.temp }}/cell-evidence
        run: node scripts/compat-matrix-results.mjs cell

      - name: Upload cell evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cell-facts-${{ matrix.cell_id }}
          path: ${{ runner.temp }}/cell-evidence
          if-no-files-found: error
          retention-days: 14

  collect:
    name: Collect and Classify Results
    runs-on: ubuntu-latest
    needs: [prepare, matrix]
    if: always()
    timeout-minutes: 10
    steps:
      - name: Checkout ProtocolCanary-Action
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download cell evidence
        if: always() && needs.prepare.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cell-facts-*
          path: cell-facts
          merge-multiple: false

      - name: Classify cells
        id: classify
        if: always()
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          MATRIX_RESULT: ${{ needs.matrix.result }}
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
          ACTION_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXECUTION_MODE: offline-xdr
          ARTIFACT_ROOT: cell-facts
        run: node scripts/compat-matrix-results.mjs collect

      - name: Print offline classification table
        if: always()
        env:
          TABLE: ${{ steps.classify.outputs.TABLE }}
        shell: bash
        run: |
          printf '%s\n\n' '### Offline Engine CLI compatibility matrix (XDR enabled; RPC and Soroban disabled)' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$TABLE" ]; then
            printf '%s\n' "$TABLE" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Compatibility results could not be classified.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload classification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-matrix
          path: compat-matrix.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail on unexpected or incomplete results
        if: always() && (steps.classify.outcome != 'success' || steps.classify.outputs.HAS_FAILURES == 'true')
        run: |
          echo "::error::Compatibility matrix contains infrastructure failures, unexpected failures, or unexpected passes."
          exit 1
