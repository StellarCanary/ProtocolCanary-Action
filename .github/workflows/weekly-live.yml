name: Weekly live integration (Testnet Protocol 30 identity / Futurenet Protocol 29)

# Run published Engine v0.3.0 against independent immutable Fixtures pins.
# Testnet checks Protocol 30 RPC identity only, not full XDR, Soroban,
# transaction, Futurenet, or Mainnet Protocol 30 compatibility.
# Futurenet still runs the published Protocol 29 fixture pack.
# Live failures are separate from PR-gating CI. Manual fixtures_ref overrides
# apply to both legs; scheduled runs use the matrix pins.
# Only the main-branch tracking job writes issues. See CONTRIBUTING.md.

on:
  workflow_dispatch:
    inputs:
      fixtures_ref:
        description: Optional Fixtures ref for both networks; empty uses each network-specific immutable pin
        required: false
        default: ""
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC

# The default token is read-only; the `track-failure` job widens its own
# scope to `issues: write` (job-level), and no other job gains any write
# permission. Keeping this here means every job is read-only unless it
# explicitly opts in.
permissions:
  contents: read

env:
  # The label that identifies the single open tracking issue (#420).
  TRACKING_LABEL: weekly-live

jobs:
  live-check:
    name: Live canary (Protocol ${{ matrix.protocol }} ${{ matrix.network }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Both legs must run even when one network is down, so a Testnet outage
      # still tells us whether Futurenet is healthy (and vice versa).
      fail-fast: false
      matrix:
        include:
          - network: testnet
            protocol: "30"
            fixtures_commit: 9feb1a85f64cd43201685fe233bf9ef15a38a752
            fixtures_label: Protocol 30 Testnet identity (unreleased commit)
            fixtures_dir: fixtures/protocol-30
            rpc-url: https://soroban-testnet.stellar.org
            passphrase: "Test SDF Network ; September 2015"
          - network: futurenet
            protocol: "29"
            fixtures_commit: 347ad6846d46b7bdf605a299501354563d79f2d9
            fixtures_label: fixtures-p29-v0.1.1 release
            fixtures_dir: fixtures/protocol-29
            rpc-url: https://rpc-futurenet.stellar.org
            passphrase: "Test SDF Future Network ; October 2022"
    env:
      TARGET_PROTOCOL: ${{ matrix.protocol }}
      NETWORK_NAME: ${{ matrix.network }}
      NETWORK_RPC_URL: ${{ matrix.rpc-url }}
      NETWORK_PASSPHRASE: ${{ matrix.passphrase }}
    steps:
      - name: Checkout this Action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout ProtocolCanary-Fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: StellarCanary/ProtocolCanary-Fixtures
          path: fixtures
          # Per-network immutable commits. P30 is a merged Fixtures commit,
          # not a published release. P29 is the v0.1.1 peeled release commit.
          ref: ${{ inputs.fixtures_ref || matrix.fixtures_commit }}
          persist-credentials: false

      - name: Record the fixtures pack under test
        shell: bash
        env:
          REQUESTED_FIXTURES_REF: ${{ inputs.fixtures_ref }}
          PINNED_FIXTURES_LABEL: ${{ matrix.fixtures_label }}
          SELECTED_FIXTURES_DIR: ${{ matrix.fixtures_dir }}
        run: |
          set -euo pipefail
          commit=$(git -C fixtures rev-parse HEAD)
          echo "fixtures commit tested: ${commit}"
          if [ -n "${REQUESTED_FIXTURES_REF:-}" ]; then
            requested="${REQUESTED_FIXTURES_REF} (manual fixtures_ref override)"
          else
            requested="${PINNED_FIXTURES_LABEL} (workflow pin)"
          fi
          {
            echo "### Fixtures pack under test"
            echo ""
            echo "- Requested ref: \`${requested}\`"
            echo "- Resolved commit: \`${commit}\`"
            echo "- Pack directory: \`${SELECTED_FIXTURES_DIR}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Stellar Protocol Canary (this Action, from source)
        id: run
        uses: ./ # zizmor: ignore[self-repository] root composite action executed from source within this repository
        with:
          # Engine v0.3.0 supports get-version-info for both selected packs.
          version: "0.3.0"
          protocol: ${{ matrix.protocol }}
          fixtures-dir: ${{ matrix.fixtures_dir }}
          network: ${{ matrix.network }}
          rpc-url: ${{ matrix.rpc-url }}

      - name: Record the network configuration
        if: always()
        run: |
          {
            echo "### Protocol ${{ matrix.protocol }} ${{ matrix.network }}"
            echo ""
            echo "- Network passphrase: \`${{ matrix.passphrase }}\`"
            echo "- RPC endpoint: ${{ matrix.rpc-url }}"
            echo "- Target protocol: ${TARGET_PROTOCOL}"
          } >> "$GITHUB_STEP_SUMMARY"

      # An unreachable endpoint must fail safely with a clear diagnostic, not
      # silently pass: surface the failure as an annotation plus a summary
      # note alongside the Action's own execution-failure summary (#352).
      - name: Notify on failure
        if: failure()
        run: |
          {
            echo "### ❌ Weekly live canary failed (Protocol ${{ matrix.protocol }} ${{ matrix.network }})"
            echo ""
            echo "- Endpoint: ${{ matrix.rpc-url }}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "If the remote RPC endpoint is unreachable, the step summary above"
            echo "carries the engine's diagnostic; the workflow fails safely instead"
            echo "of reporting a compatibility result."
          } >> "$GITHUB_STEP_SUMMARY"
      # Record this leg's outcome in the summary so the tracking job (which
      # treats a non-success `live-check` result as "at least one leg
      # failed") and a human reading the run can both see which leg it was.
      - name: Record this leg's outcome
        if: always()
        shell: bash
        env:
          LEG_NETWORK: ${{ matrix.network }}
          LEG_OUTCOME: ${{ steps.run.outcome }}
        run: |
          set -euo pipefail
          if [ "${LEG_OUTCOME:-}" = "success" ]; then
            mark="✅ passed"
          else
            mark="❌ failed (${LEG_OUTCOME:-no outcome})"
          fi
          {
            echo ""
            echo "- \`${LEG_NETWORK}\`: ${mark}"
          } >> "$GITHUB_STEP_SUMMARY"

  # One tracking issue for the weekly check (#420): a single failure that
  # repeats every Monday should not open a new issue each week. This job
  # runs once, after every matrix leg, and:
  #   * on failure — creates the `weekly-live` issue if none is open, else
  #     comments on the existing one;
  #   * on a fully green run — comments on and closes the open issue.
  # It is the only job with a write scope (`issues: write`); the workflow
  # default stays read-only.
  track-failure:
    name: Track weekly live failure
    needs: live-check
    # This workflow can be manually dispatched from a non-main ref. Only the
    # trusted main branch may use the issue-writing token.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open, update, or close the tracking issue
        id: tracking
        shell: bash
        env:
          RUN_OUTCOME: ${{ needs.live-check.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="${TRACKING_LABEL:?TRACKING_LABEL must name the tracking label}"

          # This job intentionally has no checkout. Always give gh the target
          # repository explicitly instead of relying on local git metadata.
          labels=$(gh label list --repo "$GITHUB_REPOSITORY" --json name --jq '.[].name')
          if ! grep -Fxq -- "$label" <<< "$labels"; then
            # Create the documented label on first use with this job's
            # existing issues:write permission. A second read handles a
            # concurrent creation without hiding an API or permission error.
            if ! gh label create "$label" \
              --repo "$GITHUB_REPOSITORY" \
              --color d73a4a \
              --description "Single open tracking issue for scheduled weekly live failures"; then
              labels=$(gh label list --repo "$GITHUB_REPOSITORY" --json name --jq '.[].name')
              grep -Fxq -- "$label" <<< "$labels"
            fi
          fi

          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ "${RUN_OUTCOME}" = "success" ]; then
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "The weekly live canary is green again. Run: ${RUN_URL}$(printf '\n\n')Closing this tracking issue; it is reopened automatically should the canary fail again."
              gh issue close "$issue" --reason completed
              echo "Weekly live canary passed; closed tracking issue #${issue}"
            else
              echo "Weekly live canary passed and no tracking issue is open; nothing to do."
            fi
            exit 0
          fi

          # A run that did not succeed.
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "The weekly live canary is still failing. Run: ${RUN_URL}"
            echo "Commented on existing tracking issue #${issue}"
          else
            gh issue create \
              --title "Weekly live canary is failing (Testnet/Futurenet)" \
              --label "$label" \
              --body "The scheduled weekly live canary has failed. Run: ${RUN_URL}"
            echo "Created a new tracking issue for the weekly live failure"
          fi

      - name: Record the notification outcome
        if: always()
        shell: bash
        env:
          RUN_OUTCOME: ${{ needs.live-check.result }}
          NOTIFICATION_OUTCOME: ${{ steps.tracking.outcome }}
        run: |
          {
            echo ""
            echo "### Weekly live tracking issue"
            echo ""
            echo "- Live-check result: \`${RUN_OUTCOME}\`"
            echo "- Tracker step result: ${NOTIFICATION_OUTCOME:-not run}"
          } >> "$GITHUB_STEP_SUMMARY"
