<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">ProtocolCanary-Action — GitHub Action for Protocol-Canary</title>
  <desc id="desc">A lightweight vector banner showing the ProtocolCanary GitHub Action workflow from checkout through report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFAFF"/>
      <stop offset="1" stop-color="#EEF0FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="30" fill="url(#bg)"/>
  <path d="M0 55 C160 105 235 4 390 0 L0 0Z" fill="#6D5CE7" opacity="0.11"/>
  <path d="M1600 455 C1450 385 1320 525 1145 520 H1600Z" fill="#6D5CE7" opacity="0.12"/>

  <!-- decorative curves -->
  <path d="M0 435 C190 350 350 470 515 410" fill="none" stroke="#8B7CF6" stroke-width="3" opacity="0.25"/>
  <path d="M1060 430 C1220 335 1360 455 1600 355" fill="none" stroke="#8B7CF6" stroke-width="3" opacity="0.20"/>

  <!-- logo badge -->
  <g transform="translate(74 124)">
    <polygon points="95,0 179,48 179,144 95,192 11,144 11,48" fill="#FFFFFF" stroke="url(#accent)" stroke-width="8"/>
    <circle cx="95" cy="96" r="58" fill="url(#accent)" opacity="0.96"/>
    <!-- simplified GitHub mark -->
    <path d="M95 49c-32 0-58 25-58 57 0 26 17 47 41 54 3 1 4-1 4-3v-12c-17 4-21-8-21-8-3-8-7-10-7-10-6-4 0-4 0-4 7 1 10 7 10 7 6 10 15 7 19 5 1-4 2-7 4-9-14-2-29-7-29-32 0-7 3-13 7-17-1-2-3-8 1-17 0 0 6-2 19 7 6-2 12-3 18-3s12 1 18 3c13-9 19-7 19-7 4 9 2 15 1 17 5 4 7 10 7 17 0 25-15 30-29 32 2 2 4 6 4 12v17c0 2 1 4 4 3 24-7 41-28 41-54 0-32-26-57-58-57Z" fill="#FFFFFF"/>
    <path d="M126 125l17-10-17-10-6 5 10 5-10 5z" fill="#7C3AED"/>
  </g>

  <!-- title -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="305" y="170" font-size="64" font-weight="800" fill="#101B3A">ProtocolCanary-</text>
    <text x="305" y="238" font-size="64" font-weight="800" fill="url(#accent)">Action</text>
    <text x="308" y="286" font-size="24" font-weight="600" letter-spacing="2.8" fill="#52607A">GITHUB ACTION FOR PROTOCOL-CANARY</text>
    <text x="308" y="352" font-size="27" font-weight="600" font-style="italic" fill="#6D28D9">Automate. Verify. Stay Ahead.</text>
    <path d="M307 366 C470 381 620 374 750 360" fill="none" stroke="#6D28D9" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- canary -->
  <g transform="translate(915 120)">
    <ellipse cx="80" cy="120" rx="60" ry="18" fill="#111827" opacity="0.08"/>
    <path d="M45 113c-16-24-12-55 9-76 14-14 33-19 49-12 12 5 21 16 24 31 18 0 31 11 31 25 0 16-15 28-35 29-7 16-22 26-39 26-16 0-30-8-39-23z" fill="#FFC928"/>
    <path d="M59 80c-9-19-1-38 15-45 15-7 34 2 39 18 3 10 0 21-7 28-11 11-31 13-47-1z" fill="#FFD44A"/>
    <path d="M66 103c23-7 44-5 60 2-7 18-24 28-43 28-12 0-24-5-32-14z" fill="#E5A814" opacity="0.95"/>
    <circle cx="119" cy="52" r="5" fill="#111827"/>
    <path d="M135 59l26 9-25 11z" fill="#C77719"/>
    <path d="M54 119l-25 20 33-10zM78 126l-6 24 19-22z" fill="#E3A914"/>
  </g>

  <!-- success card -->
  <g transform="translate(1240 86)" filter="url(#shadow)">
    <rect width="285" height="92" rx="18" fill="#FFFFFF" stroke="#B6B9FA" stroke-width="2"/>
    <circle cx="38" cy="46" r="20" fill="#22C55E"/>
    <path d="M29 46l7 7 13-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="41" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#172554">Workflow Success</text>
    <text x="72" y="66" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#64748B">All applicable checks passed</text>
  </g>

  <!-- workflow -->
  <g transform="translate(875 255)" filter="url(#shadow)">
    <rect width="650" height="165" rx="24" fill="#17224A"/>
    <text x="30" y="31" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#A6B3D5">CI WORKFLOW</text>

    <!-- connectors -->
    <path d="M128 86 H180" stroke="#7280C9" stroke-width="4" stroke-linecap="round"/>
    <path d="M283 86 H335" stroke="#7280C9" stroke-width="4" stroke-linecap="round"/>
    <path d="M438 86 H490" stroke="#7280C9" stroke-width="4" stroke-linecap="round"/>

    <!-- nodes -->
    <g>
      <circle cx="78" cy="86" r="42" fill="#6D28D9"/>
      <circle cx="233" cy="86" r="42" fill="#4F7DF4"/>
      <circle cx="388" cy="86" r="42" fill="#22C55E"/>
      <circle cx="543" cy="86" r="42" fill="#A855F7"/>

      <!-- simple line icons -->
      <path d="M63 86l-5-5m5 5l9-11m-9 11l9 11m-9-11H47m16 0h16" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
      <path d="M233 61v35m0 0l-12-12m12 12l12-12M215 104h36" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M372 87l10 10 22-25" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="528" y="63" width="30" height="36" rx="3" fill="none" stroke="#fff" stroke-width="4"/>
      <path d="M535 76h16M535 85h16M535 94h10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

      <text x="78" y="145" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">Checkout</text>
      <text x="233" y="145" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">Install</text>
      <text x="388" y="145" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">Run Canary</text>
      <text x="543" y="145" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">Report</text>
    </g>
  </g>

  <!-- small stars -->
  <g fill="#5B5CEB" opacity="0.9">
    <path d="M1510 78l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
    <path d="M842 77l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
  </g>
</svg>
